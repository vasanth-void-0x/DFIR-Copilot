name: Core verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core verification dependencies
        run: python -m pip install "reportlab>=4.2,<5" "yara-x>=1.19,<2"
      - name: Compile source
        run: python -m compileall -q src main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
