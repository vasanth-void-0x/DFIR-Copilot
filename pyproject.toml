[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-copilot"
version = "1.0.0"
description = "Evidence-grounded AI-assisted digital forensics workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vasanth Kumar"}]
dependencies = [
  "PySide6>=6.7,<7",
  "reportlab>=4.2,<5",
  "python-evtx>=0.8,<1",
  "yara-x>=1.19,<2",
]

[project.scripts]
dfir-copilot = "dfir_copilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
